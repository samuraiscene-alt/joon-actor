<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JOON ACTOR"><title>JOON ACTOR</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#161923;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:700px;margin:auto;padding:18px 16px 60px}header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 10px}.muted{color:#788194;font-size:13px}section{background:#fff;border:1px solid #edf0f4;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 4px 15px #2e375008}textarea,input,select{width:100%;border-radius:12px;border:1px solid #dce1e9;padding:12px;font:inherit;background:#fff}textarea{min-height:300px;line-height:1.6;resize:vertical}button,.upload{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:650;background:#eaf0ff;color:#1552be;cursor:pointer;display:inline-block}.primary{background:#1769ff;color:white}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stat{font-size:13px;color:#566171;margin:8px 0}.split{display:flex;gap:8px}.split>*{flex:1}.upload input{display:none}.warning{background:#fff8e9;padding:12px;border-radius:12px;font-size:13px;color:#785414}small{font-size:12px}</style></head>
<body><main><header><div><h1>JOON ACTOR</h1><div class="muted">대본 연습 · 초기 테스트 v0.1.1</div></div><span style="font-size:28px">🎬</span></header>
<section><h2>내 대본</h2><p class="muted">대본은 브라우저에만 저장돼. 서버로 업로드하지 않아.</p><input id="title" aria-label="대본 제목" placeholder="대본 제목"><div class="actions"><label class="upload">TXT / OCR JSON 열기<input id="import" type="file" accept=".txt,.json,text/plain,application/json"></label><button id="save" class="primary">기기에 저장</button><button id="export">TXT 백업</button></div><label class="upload" style="margin-top:8px">PDF 불러오기<input id="pdfImport" type="file" accept="application/pdf,.pdf"></label><p class="stat" id="status">대본 없음</p><p class="stat">대본은 브라우저에서만 열립니다. PDF 이미지 속 글자는 아직 자동 OCR을 지원하지 않습니다.</p><div id="pdfPreview"></div></section>
<section><h2>대본 편집</h2><textarea id="script" placeholder="여기에 대본을 붙여넣거나 TXT 파일을 열어줘."></textarea><div class="actions"><button id="speak">선택 문장 읽기</button><button id="stop">음성 정지</button></div></section>
<section><h2>리딩 설정</h2><div class="split"><select id="mode" aria-label="연기 모드"><option>대본 그대로</option><option>자연스러운 연기 (개발 예정)</option></select><select id="rate" aria-label="읽기 속도"><option value="0.85">느리게</option><option value="1" selected>보통</option><option value="1.15">빠르게</option></select></div><p class="warning">실시간 마이크 대화, 배역 자동 분리, AI 감정 연기는 아직 연결되지 않았어. 현재는 대본 입력·저장 및 선택 문장 읽기 테스트 버전이야.</p></section>
</main><script>
const $=id=>document.getElementById(id),KEY='joon_actor_local_v1';
function update(){const t=$('script').value;$('status').textContent=t.length.toLocaleString()+'자 · 로컬 저장 상태는 저장 버튼으로 확인'}
$('script').addEventListener('input',update);
$('save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify({title:$('title').value,text:$('script').value,savedAt:new Date().toISOString()}));$('status').textContent='✓ 이 기기에 저장 완료 ('+$('script').value.length.toLocaleString()+'자)'}catch(e){alert('저장 실패: '+e.message)}};
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let s=await f.text();if(f.name.toLowerCase().endsWith('.json')){const j=JSON.parse(s);s=Array.isArray(j.pages)?j.pages.map((p,i)=>'=== '+(i+1)+'페이지 ===\n'+(typeof p==='string'?p:JSON.stringify(p))).join('\n\n'):JSON.stringify(j,null,2)}$('script').value=s;$('title').value=f.name;update()}catch(err){alert('읽기 실패: '+err.message)}e.target.value=''};
$('export').onclick=()=>{const b=new Blob([$('script').value],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=($('title').value||'JOON_ACTOR')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('speak').onclick=()=>{let x=$('script'),s=x.value.slice(x.selectionStart,x.selectionEnd).trim();if(!s){alert('먼저 읽을 문장을 드래그해서 선택해줘.');return}if(!('speechSynthesis'in window)){alert('음성 출력 미지원 브라우저');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=Number($('rate').value);speechSynthesis.speak(u)};
$('stop').onclick=()=>speechSynthesis?.cancel();
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){$('title').value=j.title||'';$('script').value=j.text||'';$('status').textContent='이전에 저장한 대본을 불러왔어 ('+($('script').value.length).toLocaleString()+'자)'}}catch(e){}
</script><script>
(()=>{let pdfURL=null;
const picker=document.getElementById('pdfImport'),preview=document.getElementById('pdfPreview'),status=document.getElementById('status');
picker.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(pdfURL)URL.revokeObjectURL(pdfURL);pdfURL=URL.createObjectURL(file);preview.replaceChildren();const frame=document.createElement('iframe');frame.src=pdfURL;frame.title='선택한 PDF 원본';frame.style.cssText='width:100%;height:340px;border:1px solid #dce1e9;border-radius:12px;margin-top:10px';preview.append(frame);status.textContent='PDF 원본 확인 중 · 스캔형 PDF는 OCR JSON을 별도로 선택해 주세요.';picker.value=''});
})();
</script></body></html>
